name: reexecute

# Proves the committed cache is honest by rebuilding everything from source. Manual and
# scheduled only — never on push. Run it before any release.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --all-groups

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Fetch public-tier data
        run: uv run python data/fetch.py --all

      - name: Re-execute everything
        env:
          QUARTO_PYTHON: .venv/bin/python
        run: quarto render

      - name: Report cache drift
        run: |
          git diff --stat -- _freeze || true
          echo "Any diff above means the committed cache did not match a fresh run."
