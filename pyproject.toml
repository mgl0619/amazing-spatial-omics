[project]
name = "spatial-omics-tutorial"
version = "0.1.0"
description = "Tutorials for people who have the data and are about to trust it"
requires-python = "==3.12.*"

# Ranges here; exact versions live in uv.lock, which is committed.
# Regenerate with:  uv lock --upgrade
dependencies = [
    "anndata",
    "scanpy",
    "squidpy",
    "spatialdata",
    "spatialdata-io",
    "spatialdata-plot",
    "zarr",
    "dask",
    "pyarrow",
    "numpy",
    "pandas",
    "matplotlib",
    "colorspacious",   # compute the colour-vision check, do not eyeball it
]

[dependency-groups]
dev = [
    "pytest",
    "jupyter",          # Quarto needs a kernel to execute .qmd python cells
    "nbformat",
    "nbclient",
    "memory-profiler",  # peak memory is reported, not estimated
]

[tool.uv]
# Fail loudly rather than silently resolving something different per machine.
required-version = ">=0.5"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data"]
