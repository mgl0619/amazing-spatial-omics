<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Omics, Worked Through</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#E7EAE3; --panel:#F4F6F0; --panel-2:#DDE2D8;
  --ink:#16222A; --ink-soft:#4A5A60; --ink-faint:#7C8A8C;
  --rule:#C3CBBE; --rule-firm:#9AA795;
  --teal:#1D5A57; --teal-soft:#CBDCD6;
  --violet:#5B4F86; --violet-soft:#DAD5E8;
  --flag:#8E2F2A; --flag-soft:#F0DED9; --flag-edge:#C98878;
  --code-bg:#EDEFE8;
  --focus:#1D5A57;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10181C; --panel:#18232A; --panel-2:#213038;
    --ink:#E5EAE4; --ink-soft:#A9B8B6; --ink-faint:#79898A;
    --rule:#2C3B42; --rule-firm:#41545C;
    --teal:#7FC4B8; --teal-soft:#1E3B3C;
    --violet:#AFA2D8; --violet-soft:#2A2740;
    --flag:#E29088; --flag-soft:#33201D; --flag-edge:#7A403A;
    --code-bg:#141F25;
  }
}
:root[data-theme="dark"]{
  --ground:#10181C; --panel:#18232A; --panel-2:#213038;
  --ink:#E5EAE4; --ink-soft:#A9B8B6; --ink-faint:#79898A;
  --rule:#2C3B42; --rule-firm:#41545C;
  --teal:#7FC4B8; --teal-soft:#1E3B3C;
  --violet:#AFA2D8; --violet-soft:#2A2740;
  --flag:#E29088; --flag-soft:#33201D; --flag-edge:#7A403A;
  --code-bg:#141F25;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:100vh}
.side{border-right:1px solid var(--rule);background:var(--panel);padding:26px 20px 60px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:block;text-decoration:none;color:inherit;margin-bottom:6px}
.brand b{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.22rem;
  display:block;line-height:1.15;letter-spacing:-.01em}
.brand span{font-size:.78rem;color:var(--ink-faint);display:block;margin-top:4px}
.navgroup{margin-top:22px}
.navgroup h4{font-family:"Newsreader",serif;font-weight:500;font-size:.92rem;color:var(--teal);
  margin:0 0 6px;border-top:1px solid var(--rule-firm);padding-top:8px}
.side a.nav{display:block;text-decoration:none;color:var(--ink-soft);font-size:.86rem;
  padding:3px 0 3px 26px;text-indent:-26px;border-left:2px solid transparent;padding-left:10px}
.side a.nav:hover{color:var(--teal)}
.side a.nav.on{color:var(--ink);border-left-color:var(--teal);font-weight:500}
.side a.nav i{font-style:normal;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  margin-right:8px;font-size:.78rem}
.side a.nav.on i{color:var(--teal)}

main{padding:44px 40px 120px;max-width:820px}

/* ---------- type ---------- */
h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(1.8rem,3.6vw,2.5rem);
  line-height:1.1;letter-spacing:-.015em;margin:0 0 10px;max-width:20ch}
h1 em{font-style:italic}
h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.35rem;
  margin:44px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--rule-firm)}
h3{font-family:"Newsreader",serif;font-weight:500;font-size:1.08rem;margin:26px 0 8px}
p{margin:0 0 14px;max-width:70ch}
main ul,main ol{max-width:70ch;padding-left:22px}
li{margin:5px 0}
a{color:var(--teal)}
.lede{font-family:"Newsreader",Georgia,serif;font-size:1.16rem;line-height:1.62;
  color:var(--ink-soft);max-width:62ch;margin-bottom:22px}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.87em;
  background:var(--code-bg);padding:1px 4px;border-radius:2px}
pre{background:var(--code-bg);border:1px solid var(--rule);padding:14px 16px;
  overflow-x:auto;font-size:.83rem;line-height:1.5;margin:0 0 14px}
pre code{background:none;padding:0;font-size:1em}
.tok-c{color:var(--ink-faint);font-style:italic}
.tok-k{color:var(--violet)}
.tok-s{color:var(--teal)}

/* ---------- meta strip ---------- */
.crumb{font-size:.78rem;color:var(--ink-faint);margin-bottom:10px}
.metastrip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.pill{font-size:.75rem;border:1px solid var(--rule-firm);color:var(--ink-soft);
  padding:2px 9px;border-radius:12px;background:var(--panel)}
.pill b{font-weight:500;color:var(--ink)}
.pill.draft{border-color:var(--flag-edge);color:var(--flag);background:var(--flag-soft)}
.pill.done{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}

/* ---------- callouts ---------- */
.call{border-left:3px solid var(--rule-firm);background:var(--panel);
  padding:12px 16px;margin:0 0 18px}
.call p:last-child{margin-bottom:0}
.call .ct{font-size:.74rem;color:var(--ink-faint);display:block;margin-bottom:4px}
.call.scale{border-left-color:var(--teal)}
.call.scale .ct{color:var(--teal)}
.call.warn{border-left-color:var(--flag-edge);background:var(--flag-soft)}
.call.warn .ct{color:var(--flag)}
.decision{font-family:"Newsreader",Georgia,serif;font-size:1.14rem;line-height:1.6;
  font-style:italic;color:var(--teal);border-left:3px solid var(--teal);
  padding:6px 0 6px 16px;margin:0 0 22px;max-width:60ch}

/* ---------- slots ---------- */
.slot{margin-top:40px}
.slothead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule-firm);
  padding-bottom:6px;margin-bottom:14px}
.slothead .n{font-family:"Newsreader",serif;font-size:.82rem;color:var(--ink-faint);
  border:1px solid var(--rule-firm);border-radius:50%;width:1.55rem;height:1.55rem;
  display:grid;place-items:center;flex:none}
.slothead h2{margin:0;border:0;padding:0;font-size:1.3rem}
.slot.fail .slothead .n{border-color:var(--flag-edge);color:var(--flag)}

details{border:1px solid var(--rule);background:var(--panel);margin:0 0 10px;padding:0}
details summary{cursor:pointer;padding:11px 15px;font-size:.94rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";color:var(--teal);font-weight:600;margin-right:10px}
details[open] summary::before{content:"−"}
details[open] summary{border-bottom:1px solid var(--rule)}
details .ans{padding:12px 15px 4px}
details .ans p{margin-bottom:10px}

figure{margin:0 0 20px;border:1px solid var(--rule);background:var(--panel);padding:16px}
figure svg{display:block;width:100%;height:auto}
figcaption{font-size:.81rem;color:var(--ink-soft);margin-top:12px;max-width:66ch}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:20px}
.card{border:1px solid var(--rule);background:var(--panel);padding:15px 17px;text-decoration:none;
  color:inherit;display:block}
.card:hover{border-color:var(--teal)}
.card b{font-family:"Newsreader",serif;font-weight:500;font-size:1.02rem;display:block;margin-bottom:4px}
.card span{font-size:.83rem;color:var(--ink-soft)}

table{border-collapse:collapse;width:100%;font-size:.86rem;margin-bottom:18px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{color:var(--ink-soft);font-weight:500;font-size:.78rem;border-bottom:1px solid var(--rule-firm)}
.tablewrap{overflow-x:auto}

.pathblock{border:1px solid var(--rule);background:var(--panel);padding:16px 18px;margin-bottom:14px}
.pathblock h3{margin:0 0 2px}
.pathblock .who{font-size:.83rem;color:var(--ink-faint);margin-bottom:8px}
.pathblock .pnote{font-size:.88rem;color:var(--ink-soft);margin:0 0 12px;max-width:66ch}
.pathblock .plen{font-size:.78rem;color:var(--ink-faint);margin-top:9px}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.route a{display:inline-block;font-size:.82rem;text-decoration:none;border:1px solid var(--rule-firm);
  padding:3px 9px;color:var(--ink-soft);background:var(--ground)}
.route a:hover{border-color:var(--teal);color:var(--teal)}
.route span{color:var(--ink-faint)}

.res td:first-child{white-space:nowrap}
.res tr.unchecked td{color:var(--ink-faint)}
.res tr.unchecked code{background:none;color:var(--ink-faint)}
.checked{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:.8rem;white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:56px;
  border-top:1px solid var(--rule-firm);padding-top:14px;font-size:.88rem}
.pager a{text-decoration:none}
.pager a:hover{text-decoration:underline}

.menubtn{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);
    padding:18px 20px 24px}
  .side .navwrap{display:none}
  .side.open .navwrap{display:block}
  .menubtn{display:inline-block;font:inherit;font-size:.85rem;margin-top:12px;
    background:transparent;border:1px solid var(--rule-firm);border-radius:2px;
    padding:6px 12px;cursor:pointer;color:var(--ink)}
  main{padding:28px 20px 90px}
}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media print{.side,.pager{display:none}main{max-width:none;padding:0}}
</style>
</head>

    <rect x=\"0\"   y=\"104\" width=\"104\" height=\"72\"/>\n    <rect x=\"124\" y=\"104\" width=\"104\" height=\"72\"/>\n    <rect x=\"248\" y=\"104\" width=\"104\" height=\"72\"/>\n    <rect x=\"372\" y=\"104\" width=\"104\" height=\"72\"/>\n    <rect x=\"496\" y=\"104\" width=\"104\" height=\"72\"/>\n    <rect x=\"620\" y=\"104\" width=\"100\" height=\"72\"/>\n  </g>\n  <g font-size=\"10.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <text x=\"52\"  y=\"122\">Degraded RNA</text><text x=\"52\"  y=\"136\">reads as low</text>\n    <text x=\"52\"  y=\"150\">expression,</text><text x=\"52\"  y=\"164\">not low quality</text>\n\n    <text x=\"176\" y=\"122\">Thickness sets</text><text x=\"176\" y=\"136\">counts per cell.</text>\n    <text x=\"176\" y=\"150\">Two thicknesses</text><text x=\"176\" y=\"164\">= two \"states\"</text>\n\n    <text x=\"300\" y=\"122\">Efficiency varies</text><text x=\"300\" y=\"136\">by region; looks</text>\n    <text x=\"300\" y=\"150\">like a gradient</text><text x=\"300\" y=\"164\">of expression</text>\n\n    <text x=\"424\" y=\"122\">Depth differs</text><text x=\"424\" y=\"136\">per run. Batch</text>\n    <text x=\"424\" y=\"150\">and condition</text><text x=\"424\" y=\"164\">now overlap</text>\n\n    <text x=\"548\" y=\"122\">Misregistration</text><text x=\"548\" y=\"136\">moves cells to</text>\n    <text x=\"548\" y=\"150\">the wrong</text><text x=\"548\" y=\"164\">morphology</text>\n\n    <text x=\"670\" y=\"122\">Merged cells</text><text x=\"670\" y=\"136\">become a</text>\n    <text x=\"670\" y=\"150\">\"transitional\"</text><text x=\"670\" y=\"164\">cluster</text>\n  </g>\n\n  <text x=\"0\" y=\"204\" font-size=\"12\" fill=\"var(--flag)\">Each box below is an analysis result you can produce without any error being raised.</text>\n  <text x=\"0\" y=\"228\" font-size=\"11.5\" fill=\"var(--ink-soft)\">The methods section you were given probably records two or three of these six decisions.</text>\n  <text x=\"0\" y=\"246\" font-size=\"11.5\" fill=\"var(--ink-soft)\">Everything downstream — clustering, annotation, differential expression, interaction</text>\n  <text x=\"0\" y=\"264\" font-size=\"11.5\" fill=\"var(--ink-soft)\">inference — inherits all of them, and none of them are visible in the count matrix.</text>\n </g>\n</svg>",
  "figcap": "Six decisions sit between the tissue and your count matrix. Each one can produce a pattern that survives clustering, annotation and differential expression without ever raising an error.",
  "conceptHTML": "\n<p>A count matrix looks like a measurement. It is not. It is the output of a chain of\nphysical and computational decisions, most of which were made by someone else, several of\nwhich were not recorded, and all of which are still present in the numbers.</p>\n\n<p>This lesson is not a protocol. You will not learn incubation times here, and you should\nnot want to — those live in the vendor documentation and change between chemistry\nversions. What you need is different: a working model of which bench decision produces\nwhich analysis artifact, so that when you see a pattern you can ask whether a knife or a\nbuffer could have made it.</p>\n\n<h3>The six steps, and what each one leaves behind</h3>\n\n<p><b>Collection and fixation.</b> Time between excision and fixation determines RNA\nintegrity, and fresh-frozen and FFPE material behave differently enough that they are\neffectively different assays. Degraded RNA does not announce itself as degraded — it\nappears as low expression, and low expression appears as a quiescent or low-activity cell\nstate. A region that took longer to fix looks metabolically quieter.</p>\n\n<p><b>Embedding and sectioning.</b> Section thickness sets how much of each cell is in the\nplane, which sets counts per cell. A ten-micron section and a five-micron section from the\nsame block yield systematically different totals. If those two sections are your two\nconditions, you have measured the cryostat.</p>\n\n<p><b>Permeabilisation, probe hybridisation or capture.</b> Efficiency is not uniform\nacross a section. Dense tissue, fibrotic regions and areas near a fold permeabilise\ndifferently, so capture efficiency varies spatially — and spatially varying efficiency is\nindistinguishable, in the matrix alone, from a spatially varying expression gradient. This\nis one reason lesson 12's warning about spatial statistics bites so hard: the artifact has\nexactly the structure the analysis is looking for.</p>\n\n<p><b>Imaging cycles or sequencing.</b> Sequencing depth differs between runs; imaging runs\ndiffer in cycle count, focus quality and photobleaching across cycles. Depth differences\nare the ordinary batch effect everyone knows about. The problem is not that they exist, it\nis that they are usually aligned with something you care about, because samples processed\ntogether tend to share a condition.</p>\n\n<p><b>Decoding and registration.</b> Transcripts are assigned to positions, and positions\nare registered against the morphology image. Misregistration moves cells into the wrong\nanatomical compartment while leaving their expression untouched, producing cells that look\nlike one type sitting confidently in the wrong place. Lesson 6 is entirely about catching\nthis.</p>\n\n<p><b>Segmentation.</b> Boundaries are drawn, and every count is assigned to a cell.\nLesson 7 covers what goes wrong here in detail; for now the point is only that this is a\ncomputational decision, usually made with default parameters, and that it is the last step\nbefore the object you were handed.</p>\n\n<h3>What the methods section will tell you</h3>\n\n<p>In practice, two or three of those six. Chemistry version and platform are almost always\nrecorded. Section thickness sometimes is. Time to fixation, permeabilisation conditions,\nand the segmentation parameters usually are not, and the software versions almost never\nare — which is why lesson 17 exists.</p>\n\n<p>So the first analysis you run on an inherited dataset is not clustering. It is reading\nthe run metadata and writing down, explicitly, which of these decisions you know and which\nyou are assuming. The ones you are assuming are your list of alternative explanations, and\nyou will need it the first time a cluster appears in one section and not another.</p>\n\n<p>The assumption that breaks first is the quiet one: that the matrix is data. It is a\nresult, and it has a methods section of its own.</p>",
  "codePython": "<span class=\"tok-c\"># Not yet executed. Run it, read the output, then commit the freeze cache.</span>\n<span class=\"tok-k\">import</span> spatialdata <span class=\"tok-k\">as</span> sd\n\nsdata = sd.read_zarr(<span class=\"tok-s\">\"data/cache/toy_section.zarr\"</span>)\n\n<span class=\"tok-c\"># Everything the run recorded about how it was produced.</span>\n<span class=\"tok-k\">for</span> key, value <span class=\"tok-k\">in</span> sdata.attrs.items():\n    <span class=\"tok-k\">print</span>(<span class=\"tok-s\">f\"{key:&lt;28} {value}\"</span>)\n\n<span class=\"tok-c\"># The six decisions. Anything that comes back None is not a default —</span>\n<span class=\"tok-c\"># it is an alternative explanation you will need later.</span>\nDECISIONS = [\n    <span class=\"tok-s\">\"fixation\"</span>, <span class=\"tok-s\">\"section_thickness_um\"</span>, <span class=\"tok-s\">\"permeabilisation\"</span>,\n    <span class=\"tok-s\">\"chemistry_version\"</span>, <span class=\"tok-s\">\"registration_method\"</span>, <span class=\"tok-s\">\"segmentation_method\"</span>,\n]\nknown = {k: sdata.attrs.get(k) <span class=\"tok-k\">for</span> k <span class=\"tok-k\">in</span> DECISIONS}\nunknown = [k <span class=\"tok-k\">for</span> k, v <span class=\"tok-k\">in</span> known.items() <span class=\"tok-k\">if</span> v <span class=\"tok-k\">is</span> <span class=\"tok-k\">None</span>]\n<span class=\"tok-k\">print</span>(<span class=\"tok-s\">\"\\nnot recorded:\"</span>, unknown)",
  "codeAssert": "<span class=\"tok-c\"># Delete a metadata field on purpose and confirm this fails rather than</span>\n<span class=\"tok-c\"># quietly filling in a default. Silent defaults are how the six decisions</span>\n<span class=\"tok-c\"># disappear from the record.</span>\n\n<span class=\"tok-k\">assert</span> known[<span class=\"tok-s\">\"section_thickness_um\"</span>] <span class=\"tok-k\">is not</span> <span class=\"tok-k\">None</span>, (\n    <span class=\"tok-s\">\"thickness unrecorded: counts per cell are not comparable across sections\"</span>\n)\n\n<span class=\"tok-c\"># If more than one section is present, thickness must match before</span>\n<span class=\"tok-c\"># any count-based comparison is meaningful.</span>\nthicknesses = {s: m[<span class=\"tok-s\">\"section_thickness_um\"</span>] <span class=\"tok-k\">for</span> s, m <span class=\"tok-k\">in</span> per_section.items()}\n<span class=\"tok-k\">assert</span> len(set(thicknesses.values())) == <span class=\"tok-s\">1</span>, (\n    <span class=\"tok-s\">f\"sections cut at different thicknesses: {thicknesses}\"</span>\n)",
  "codeR": "<span class=\"tok-c\"># The run metadata lives in the vendor output, not in either ecosystem's</span>\n<span class=\"tok-c\"># object model, so both languages read the same files.</span>\nlibrary(jsonlite)\n\nmeta <- fromJSON(<span class=\"tok-s\">\"data/cache/toy_section/experiment.xenium\"</span>)\nstr(meta, max.level = <span class=\"tok-s\">1</span>)\n\n<span class=\"tok-c\"># Same six decisions, same question: which are absent?</span>\ndecisions <- c(<span class=\"tok-s\">\"fixation\"</span>, <span class=\"tok-s\">\"section_thickness_um\"</span>, <span class=\"tok-s\">\"permeabilisation\"</span>,\n               <span class=\"tok-s\">\"chemistry_version\"</span>, <span class=\"tok-s\">\"registration_method\"</span>, <span class=\"tok-s\">\"segmentation_method\"</span>)\nsetdiff(decisions, names(meta))",
  "answers": [
   "Usually platform and chemistry version, sometimes section thickness, and rarely anything else. Time to fixation, permeabilisation conditions and segmentation parameters are the three most consequential omissions. Write down which you know; the remainder is your list of alternative explanations, and you will want it in writing before you are attached to a result.",
   "Reagent lot, operator, instrument calibration, ambient conditions, and time in storage before processing — none of which appear in the matrix. This is why lesson 14 insists that section is batch: processing day is a bundle of unrecorded variables, and if it lines up with your condition, no correction can separate them because there is nothing in the data that distinguishes them.",
   "Total counts per cell in each section, plotted against recorded thickness and against the number of cells recovered. If the cluster is defined by high or low overall expression rather than by specific markers, you are probably looking at a capture or thickness difference. Check that before checking anything biological — it costs one plot and rules out the most common artifact."
  ],

  "title": "Coordinate systems, and the flipped axis",
  "decision": "Your tissue map looks anatomically right and your PI believes it. Decide whether the points and the image are actually in the same coordinate system before it goes in the grant.",

  "asserts": "Transformed extent equals image extent within tolerance; a known landmark lands on itself",
  "rosetta": "The same overlay in R, and the point at which the two ecosystems disagree about the origin",
  "runtime": "2 min",
  "memory": "under 2 GB",
  "unsafe": "nothing at this size",
  "failure": "A flipped y-axis produces a tissue map that is anatomically plausible and entirely mirrored. Nothing errors.",
  "diagnostic": "Overlay on the image with an asymmetric landmark visible; the mirror is obvious only then.",
  "checks": [

  "further": "Registration across sections is lesson 11.",

  "fig": "\n<svg viewBox=\"0 0 720 260\" role=\"img\" aria-label=\"Three panels: the tissue image with an asymmetric landmark, points correctly overlaid, and points overlaid with a flipped y-axis producing a mirrored but plausible map.\">\n  <g font-family=\"IBM Plex Sans\">\n  <text x=\"0\" y=\"14\" font-size=\"12\" fill=\"var(--ink-faint)\">Image (intrinsic)</text>\n  <rect x=\"0\" y=\"24\" width=\"200\" height=\"180\" fill=\"var(--panel-2)\" stroke=\"var(--rule-firm)\"/>\n  <path d=\"M20 184 L100 44 L180 184 Z\" fill=\"var(--ink)\" fill-opacity=\"0.13\"/>\n  <circle cx=\"150\" cy=\"70\" r=\"12\" fill=\"var(--violet)\" fill-opacity=\"0.5\"/>\n  <text x=\"0\" y=\"222\" font-size=\"11\" fill=\"var(--ink-soft)\">Landmark sits upper-right</text>\n\n  <text x=\"260\" y=\"14\" font-size=\"12\" fill=\"var(--teal)\">Correct transform</text>\n  <rect x=\"260\" y=\"24\" width=\"200\" height=\"180\" fill=\"var(--panel-2)\" stroke=\"var(--teal)\"/>\n  <path d=\"M280 184 L360 44 L440 184 Z\" fill=\"var(--ink)\" fill-opacity=\"0.13\"/>\n  <circle cx=\"410\" cy=\"70\" r=\"12\" fill=\"var(--violet)\" fill-opacity=\"0.5\"/>\n  <g fill=\"var(--teal)\">\n    <circle cx=\"330\" cy=\"150\" r=\"3.4\"/><circle cx=\"352\" cy=\"128\" r=\"3.4\"/><circle cx=\"372\" cy=\"150\" r=\"3.4\"/>\n    <circle cx=\"360\" cy=\"96\" r=\"3.4\"/><circle cx=\"342\" cy=\"170\" r=\"3.4\"/><circle cx=\"390\" cy=\"172\" r=\"3.4\"/>\n    <circle cx=\"408\" cy=\"72\" r=\"3.4\"/><circle cx=\"414\" cy=\"66\" r=\"3.4\"/>\n  </g>\n  <text x=\"260\" y=\"222\" font-size=\"11\" fill=\"var(--ink-soft)\">Points land on the landmark</text>\n\n  <text x=\"520\" y=\"14\" font-size=\"12\" fill=\"var(--flag)\">Flipped y — nothing errors</text>\n  <rect x=\"520\" y=\"24\" width=\"200\" height=\"180\" fill=\"var(--panel-2)\" stroke=\"var(--flag-edge)\"/>\n  <path d=\"M540 184 L620 44 L700 184 Z\" fill=\"var(--ink)\" fill-opacity=\"0.13\"/>\n  <circle cx=\"670\" cy=\"70\" r=\"12\" fill=\"var(--violet)\" fill-opacity=\"0.5\"/>\n  <g fill=\"var(--flag)\">\n    <circle cx=\"590\" cy=\"78\" r=\"3.4\"/><circle cx=\"612\" cy=\"100\" r=\"3.4\"/><circle cx=\"632\" cy=\"78\" r=\"3.4\"/>\n    <circle cx=\"620\" cy=\"132\" r=\"3.4\"/><circle cx=\"602\" cy=\"58\" r=\"3.4\"/><circle cx=\"650\" cy=\"56\" r=\"3.4\"/>\n    <circle cx=\"668\" cy=\"156\" r=\"3.4\"/><circle cx=\"674\" cy=\"162\" r=\"3.4\"/>\n  </g>\n  <text x=\"520\" y=\"222\" font-size=\"11\" fill=\"var(--ink-soft)\">Still a plausible tissue. Landmark</text>\n  <text x=\"520\" y=\"238\" font-size=\"11\" fill=\"var(--ink-soft)\">is now bare.</text>\n  </g>\n</svg>",
  "figcap": "A mirrored tissue is still a tissue. Symmetric structures hide the flip completely; only an asymmetric landmark exposes it, which is why the overlay must include one.",
  "conceptHTML": "\n<p>A spatial dataset is not one thing with coordinates. It is several elements — an image,\na set of points, polygons for cell boundaries, a table of counts — each of which was\nproduced by a different piece of software with its own idea of where the origin is and\nwhat one unit means. The coordinates only agree because something made them agree.</p>\n\n<p>The distinction that matters is between an element's <b>intrinsic</b> coordinate system\nand the <b>extrinsic</b> one shared across elements. A microscope image is intrinsically\nindexed in pixels, starting at the top-left corner, with y increasing downward — an\ninheritance from raster graphics, not from biology. Transcript detections usually arrive\nin microns, sometimes relative to a different origin, occasionally with y increasing\nupward because whoever wrote the exporter thought in Cartesian terms. Neither is wrong.\nThey are simply different, and the transformation between them is a real object that\neither exists or does not.</p>\n\n<p>Frameworks like SpatialData make that transformation explicit precisely because getting\nit wrong is so easy and so quiet. When you register an element into a shared coordinate\nsystem, you are asserting a scale factor, possibly a rotation, and an origin. If you never\nmake that assertion, the elements are still plotted together — matplotlib will happily draw\npoints and an image on the same axes — but their alignment is now an accident of the\nnumbers happening to fall in a similar range.</p>\n\n<h3>The quantity, and its units</h3>\n\n<p>The thing to keep track of is the scale factor: microns per pixel, and its reciprocal.\nEvery imaging run has one, usually in the metadata. If your scale bar is drawn from an\nassumed value rather than the recorded one, every distance you report downstream — every\nneighbourhood radius in lesson 8, every interaction distance in lesson 10 — is wrong by\nthat ratio. A 20% error in microns per pixel is invisible in a plot and fatal in a\nneighbourhood analysis.</p>\n\n<p>Three failures account for most of what goes wrong, and none of them raise an\nexception:</p>\n\n<ul>\n<li><b>Pixels treated as microns.</b> The map looks right; the scale bar is a fiction; all\nyour distance thresholds are off by a constant factor you never notice because the plot\nis unitless to the eye.</li>\n<li><b>A flipped y-axis.</b> The tissue is mirrored. Anatomy is often roughly symmetric, so\nthis survives inspection. In a section with genuine left–right structure it will reverse\nyour conclusion.</li>\n<li><b>Image and table registered to different systems.</b> Each is internally consistent.\nOverlaid, they are offset by a translation nobody applied, and cells get assigned to the\nwrong morphological region.</li>\n</ul>\n\n<p>What makes these dangerous is not that they are subtle in principle. It is that the\noutput of each is a picture of a tissue, and tissue is exactly the kind of object where the\nhuman eye supplies plausibility for free. You look at a mirrored cortex and see a cortex.</p>\n\n<h3>The check that costs ten seconds</h3>\n\n<p>Overlay the points on the image and look at it, once, in every analysis. Not a scatter of\npoints on white — the points on top of the actual image, with an asymmetric landmark in the\nfield of view. A ventricle, a tumour margin, a folded edge, anything that is not\nsymmetric. If the transform is wrong, the points will sit somewhere the tissue is not, and\nyou will see it immediately.</p>\n\n<p>This is the cheapest diagnostic in the entire field and it is skipped constantly, usually\nbecause the analysis started from a provided cell-by-gene matrix where the image was never\nloaded at all. If you never load the image, you cannot make this check, and you have no\nindependent evidence that your coordinates mean anything.</p>",
  "codePython": "<span class=\"tok-c\"># Not yet executed. Run it, read the output, then commit the freeze cache.</span>\n<span class=\"tok-k\">import</span> spatialdata <span class=\"tok-k\">as</span> sd\n<span class=\"tok-k\">import</span> spatialdata_plot  <span class=\"tok-c\"># registers the .pl accessor</span>\n\nsdata = sd.read_zarr(<span class=\"tok-s\">\"data/cache/toy_section.zarr\"</span>)\n\n<span class=\"tok-c\"># What coordinate systems exist, and which elements live in each?</span>\n<span class=\"tok-k\">print</span>(sdata.coordinate_systems)\n\n<span class=\"tok-c\"># The transformation is an object. If this is identity, ask why.</span>\n<span class=\"tok-k\">from</span> spatialdata.transformations <span class=\"tok-k\">import</span> get_transformation\n<span class=\"tok-k\">print</span>(get_transformation(sdata[<span class=\"tok-s\">\"transcripts\"</span>], <span class=\"tok-s\">\"global\"</span>))\n\n<span class=\"tok-c\"># The check: points on top of the image, with a scale bar.</span>\n(\n    sdata.pl.render_images(<span class=\"tok-s\">\"morphology\"</span>)\n         .pl.render_points(<span class=\"tok-s\">\"transcripts\"</span>, size=<span class=\"tok-s\">1</span>)\n         .pl.show(coordinate_systems=<span class=\"tok-s\">\"global\"</span>)\n)",
  "codeAssert": "<span class=\"tok-c\"># Sabotage the transform above and confirm BOTH of these fail.</span>\n<span class=\"tok-k\">import</span> numpy <span class=\"tok-k\">as</span> np\n\npts = sdata[<span class=\"tok-s\">\"transcripts\"</span>].compute()\nimg_extent = sd.get_extent(sdata[<span class=\"tok-s\">\"morphology\"</span>], coordinate_system=<span class=\"tok-s\">\"global\"</span>)\npts_extent = sd.get_extent(sdata[<span class=\"tok-s\">\"transcripts\"</span>], coordinate_system=<span class=\"tok-s\">\"global\"</span>)\n\n<span class=\"tok-k\">assert</span> np.allclose(\n    [img_extent[<span class=\"tok-s\">\"x\"</span>], img_extent[<span class=\"tok-s\">\"y\"</span>]],\n    [pts_extent[<span class=\"tok-s\">\"x\"</span>], pts_extent[<span class=\"tok-s\">\"y\"</span>]],\n    rtol=<span class=\"tok-s\">0.05</span>,\n), <span class=\"tok-s\">\"points and image do not span the same region\"</span>\n\n<span class=\"tok-c\"># A landmark at a known micron position must land on itself.</span>\n<span class=\"tok-k\">assert</span> np.allclose(landmark_from_points, LANDMARK_TRUTH_UM, atol=<span class=\"tok-s\">5.0</span>)",
  "codeR": "<span class=\"tok-c\"># The same overlay in Seurat. Note where the origin convention differs:</span>\n<span class=\"tok-c\"># Seurat's spatial coordinates follow the image row/column order, so a</span>\n<span class=\"tok-c\"># dataset that plots correctly in Python can appear flipped here.</span>\nlibrary(Seurat)\n\nobj <- LoadXenium(<span class=\"tok-s\">\"data/cache/toy_section/\"</span>)\nImageDimPlot(obj, fov = <span class=\"tok-s\">\"fov\"</span>, axes = TRUE)\n\n<span class=\"tok-c\"># Confirm against the same landmark before trusting anything downstream.</span>\nGetTissueCoordinates(obj)[1:5, ]",
  "answers": [
   "Check, do not assume. Read the microns-per-pixel value from the run metadata and confirm your plotted scale bar was drawn from it. If your bar is in pixels, every distance threshold downstream — neighbourhood radii, interaction distances — is scaled by an unknown constant.",
   "Whichever element you registered the others into, and it should be a deliberate choice rather than whichever loaded first. In SpatialData that is the coordinate system named in the transformation; ask which element defines it and what the transformation to it actually is. If the answer is identity for everything, nobody registered anything.",
   "Often, entirely reasonable — which is the problem. Points and image may span similar numeric ranges by coincidence, so the overlay looks plausible while being offset or mirrored. That is why the check requires an asymmetric landmark: with a symmetric field of view, skipping the transform and applying it correctly can produce indistinguishable pictures."
  ],
  "sources": "SpatialData framework paper; the OME-NGFF specification. Both need verifying against the published record before citation."
 },

  "figcap": "Both histograms come from tissue containing no true expression signal. The naive test produces a spike at zero because it counted correlated neighbours as independent evidence. Under a correct null, p-values are uniform — a flat histogram is what a calibrated test looks like.",
  "conceptHTML": "\n<p>Every test you inherited from dissociated single-cell analysis assumes its observations\nare independent draws. That assumption was never exactly true, but dissociation at least\ndestroyed the spatial arrangement that would have made the violation systematic. In intact\ntissue the arrangement is preserved, and it is preserved because it is the thing you came\nto study.</p>\n\n<p>Cells near each other share a niche, an oxygen gradient, a lineage history, and a local\nmicroenvironment. Their expression is correlated for reasons that have nothing to do with\nwhatever hypothesis you are testing. Near things are more related than distant things —\nthis is the first law of geography, and in spatial biology it is both the signal and the\nproblem. It is the signal because spatial structure is why you paid for the assay. It is\nthe problem because the structure is present <em>under the null too</em>.</p>\n\n<h3>The quantity, and its units</h3>\n\n<p>Spatial autocorrelation is usually summarised by Moran's I: a dimensionless statistic\nrunning roughly from −1 to +1, with an expectation of −1/(n−1) — very slightly below zero —\nwhen there is no spatial structure at all. The critical thing to internalise is that\nMoran's I is not a property of a gene. It is a property of a gene <em>and a weights\nmatrix</em>. Change the neighbourhood definition and the number changes. A reported I\nwithout a stated graph is not interpretable, which is the same disease lesson 8 diagnoses\nfrom a different angle.</p>\n\n<p>The mechanism by which this breaks a p-value is worth stating plainly, because it is not\nmysterious. A test computes a statistic and compares it to the spread you would expect\nunder the null. That spread depends on how much independent information you have. With\npositively autocorrelated data, ten thousand cells do not carry ten thousand cells' worth\nof information — neighbouring cells are partly telling you the same thing twice. The\neffective sample size is smaller, sometimes by more than an order of magnitude. The test\ndoes not know this. It divides by a standard error computed as though every cell were a\nfresh draw, gets a number that is too small, and returns a p-value that is too small with\nit. The result is <b>anticonservative</b>: too many rejections, confidently.</p>\n\n<h3>Why the wrong gene list looks right</h3>\n\n<p>This is the part that makes the failure survive review. When a miscalibrated test hands\nback three hundred genes, those genes are not a random sample of the transcriptome. They\nare the genes with the strongest spatial structure — which means the genes that track\nanatomy. Anatomy is biologically coherent, so the list is enriched for coherent pathways.\nYou run enrichment analysis, get regionally sensible terms, and the story writes itself.</p>\n\n<p>Nothing about the output looks broken. The volcano plot is normal, the q-values are\nsmall, the biology is plausible. The only evidence that anything went wrong lives in a\ncomparison you have not run yet.</p>\n\n<h3>What a permutation has to preserve</h3>\n\n<p>The instinct is to permute, and the instinct is right — but what you shuffle decides what\nyou are testing, and the obvious shuffle tests the wrong thing.</p>\n\n<p>If you shuffle expression values freely across all cells, you destroy the spatial\nstructure entirely. The resulting null says \"there is no spatial pattern of any kind.\"\nAlmost every gene rejects that null, because tissue has structure. You have built a test\nfor the presence of anatomy and then discovered anatomy.</p>\n\n<p>What you usually want is a null that <em>keeps</em> the spatial structure and breaks only\nthe association you are asking about. That means a structure-preserving randomisation:\ntoroidal shifts of the whole pattern, permutation restricted within anatomical regions or\nwithin density strata, or a parametric null that simulates from a fitted spatial covariance\nmodel. Each makes a different assumption about what counts as background. Being explicit\nabout which one you chose is most of the work.</p>\n\n<p>The one assumption that breaks first, before any of the others: that neighbouring cells\nare independent observations. Once that is false, every downstream p-value is a number\nwhose meaning you have not established.</p>",
  "codePython": "<span class=\"tok-c\"># Not yet executed. Run it, read the output, then commit the freeze cache.</span>\n<span class=\"tok-k\">import</span> numpy <span class=\"tok-k\">as</span> np\n<span class=\"tok-k\">from</span> data.simulate <span class=\"tok-k\">import</span> simulate_null_tissue\n\n<span class=\"tok-c\"># Spatially structured tissue. No gene has a true spatial signal.</span>\nadata, truth = simulate_null_tissue(n_cells=<span class=\"tok-s\">4000</span>, n_genes=<span class=\"tok-s\">500</span>, seed=<span class=\"tok-s\">0</span>)\n<span class=\"tok-k\">assert</span> truth[<span class=\"tok-s\">\"n_true_svg\"</span>] == <span class=\"tok-s\">0</span>\n\n<span class=\"tok-c\"># The naive route: build a graph, run the standard test, count rejections.</span>\n<span class=\"tok-k\">import</span> squidpy <span class=\"tok-k\">as</span> sq\nsq.gr.spatial_neighbors(adata, radius=<span class=\"tok-s\">30.0</span>, coord_type=<span class=\"tok-s\">\"generic\"</span>)\nsq.gr.spatial_autocorr(adata, mode=<span class=\"tok-s\">\"moran\"</span>, n_perms=<span class=\"tok-s\">100</span>)\n\nnaive_fpr = (adata.uns[<span class=\"tok-s\">\"moranI\"</span>][<span class=\"tok-s\">\"pval_norm_fdr_bh\"</span>] &lt; <span class=\"tok-s\">0.05</span>).mean()\n<span class=\"tok-k\">print</span>(<span class=\"tok-s\">f\"naive false positive rate: {naive_fpr:.3f}\"</span>)  <span class=\"tok-c\"># expect &gt;&gt; 0.05</span>",
  "codeAssert": "<span class=\"tok-c\"># These asserts ARE the lesson. Sabotage the permutation below —</span>\n<span class=\"tok-c\"># swap it for a free shuffle — and confirm the second one fails.</span>\n\n<span class=\"tok-k\">assert</span> naive_fpr &gt; <span class=\"tok-s\">0.15</span>, (\n    <span class=\"tok-s\">\"the naive test should be badly miscalibrated here; \"</span>\n    <span class=\"tok-s\">\"if it is not, the simulated tissue has no autocorrelation\"</span>\n)\n\n<span class=\"tok-k\">assert</span> <span class=\"tok-s\">0.02</span> &lt; corrected_fpr &lt; <span class=\"tok-s\">0.08</span>, (\n    <span class=\"tok-s\">f\"structure-preserving null should sit near nominal 0.05, got {corrected_fpr}\"</span>\n)\n\n<span class=\"tok-c\"># Guard against the vacuous assert: confirm we tested something.</span>\n<span class=\"tok-k\">assert</span> len(pvals) == adata.n_vars &gt; <span class=\"tok-s\">0</span>",
  "codeR": "<span class=\"tok-c\"># The same null data through the R route, reporting its own false</span>\n<span class=\"tok-c\"># positive rate. A method is not exempt because it is in another language.</span>\nlibrary(Seurat)\n\nobj <- readRDS(<span class=\"tok-s\">\"data/cache/null_tissue.rds\"</span>)\nobj <- FindSpatiallyVariableFeatures(\n  obj, assay = <span class=\"tok-s\">\"Spatial\"</span>, features = VariableFeatures(obj),\n  selection.method = <span class=\"tok-s\">\"moransi\"</span>\n)\n\nsvf <- SpatiallyVariableFeatures(obj, selection.method = <span class=\"tok-s\">\"moransi\"</span>)\ncat(<span class=\"tok-s\">\"R route flagged\"</span>, length(svf), <span class=\"tok-s\">\"of\"</span>, nrow(obj), <span class=\"tok-s\">\"genes on null data\\n\"</span>)",

  const w = document.getElementById("navwrap");
  let h = '<div class="navgroup"><h4>Start</h4>'
        + '<a class="nav" href="#/" data-r="/">Home</a>'
        + '<a class="nav" href="#/paths" data-r="/paths">Reader paths</a>'
        + '<a class="nav" href="#/data" data-r="/data">Data strategy</a>'
        + '<a class="nav" href="#/resources" data-r="/resources">Resources</a>'
        + '<a class="nav" href="#/how" data-r="/how">How a lesson is built</a></div>';
  TRACKS.forEach(t => {
    const ls = LESSONS.filter(l => l.track === t.id);
    if(!ls.length) return;
    h += '<div class="navgroup"><h4>' + esc(t.name) + '</h4>';
    ls.forEach(l => {
      h += '<a class="nav" href="#/' + slugOf(l) + '" data-r="/' + slugOf(l) + '">'
        + '<i>' + String(l.n).padStart(2,"0") + '</i>' + esc(l.title) + '</a>';
    });
    h += '</div>';
  });
  w.innerHTML = h;
}

/* ---------- pages ---------- */
function pageHome(){
  const written = LESSONS.filter(l => l.status === "written").length;
  const cards = TRACKS.map(t => {
    const ls = LESSONS.filter(l => l.track === t.id);
    return '<a class="card" href="#/' + slugOf(ls[0]) + '"><b>' + esc(t.name) + '</b>'
      + '<span>' + ls.length + ' lessons, starting with “' + esc(ls[0].title) + '”</span></a>';
  }).join("");
  return `
<h1>Nothing here <em>crashes.</em> That is what this site teaches.</h1>
<p class="lede">Every lesson answers one decision you actually face, runs on data small
enough to download now, and ends by showing you the wrong answer it can produce without
ever throwing an error.</p>

<p>Bad segmentation produces a beautiful UMAP. A flipped y-axis produces a plausible
tissue map. Two sections cut at different thicknesses produce a convincing new cell state. A differential test run across spatially autocorrelated neighbours returns
confident p-values for what is only tissue architecture. Almost nothing in this field
fails loudly, so a tutorial that only shows you what worked has taught you the wrong
base rate.</p>

<div class="call warn"><span class="ct">Status</span>
<p>${written} of ${LESSONS.length} lessons are written in full — start with
<a href="#/l09">lesson 9</a> or <a href="#/l03">lesson 3</a>. The rest carry their
structure, their failure mode and their scale notes, but not yet their prose or executed
notebooks. Nothing here has been run end to end, and no citation has been verified against
the published record. Both are tracked per lesson rather than glossed.</p></div>

<h2>Where to start</h2>
<div class="cards">${cards}</div>
<p>If you would rather follow a route than a table of contents, the
<a href="#/paths">reader paths</a> are organised by why you turned up. If you would rather
read something that already exists, <a href="#/resources">Resources</a> catalogues the
public workshops, tool ecosystems and benchmarks worth your time — including the ones that
do parts of this better than we do.</p>

<h2>What you will be able to do</h2>
<ul>
<li><b>Name the regime</b> — state what a platform physically measures and at what
resolution, and name the claims its data cannot support.</li>
<li><b>Verify alignment</b> — confirm that points, images and tables share a coordinate
system before believing any tissue map.</li>
<li><b>Interrogate segmentation</b> — inspect masks over the image and recognise the
signatures of over- and under-segmentation downstream.</li>
<li><b>Choose a valid null</b> — apply a test that respects spatial autocorrelation
instead of one that assumes independent samples.</li>
<li><b>Spot a silent failure</b> — recognise output that is plausible, non-crashing and
wrong, and know which figure exposes it.</li>
<li><b>Run it again</b> — reproduce an analysis from a pinned environment, with runtime
and peak memory known in advance.</li>
</ul>

<h2>Where the boundary sits</h2>
<p>The site covers the experimental decisions that determine what your data can support —
allocation and blocking, what each bench step leaves behind in the matrix, what a targeted
panel can and cannot see. It does not cover bench execution: buffers, incubation times and
instrument settings belong to the vendor protocol and change between chemistry versions
faster than a tutorial can honestly track.</p>
<p>Also out of scope: platform selection advice, and benchmarking methods against each
other. Both age badly, and both are better served by the literature than by a tutorial.</p>`;
}

function pagePaths(){
  const blocks = PATHS.map(p => {
    const route = p.ls.map((n,i) => {
      const l = byN(n);
      return (i ? '<span>→</span>' : '') +
        '<a href="#/' + slugOf(l) + '">' + String(n).padStart(2,"0") + ' · ' + esc(l.title) + '</a>';
    }).join("");
    return '<div class="pathblock"><h3>' + esc(p.name) + '</h3>'
      + '<div class="who">' + esc(p.who) + ' · Assumes: ' + esc(p.assumes) + '</div>'
      + '<p class="pnote">' + esc(p.note) + '</p>'
      + '<div class="route">' + route + '</div>'
      + '<div class="plen">' + p.ls.length + ' lessons</div></div>';
  }).join("");
  return `
<h1>Reader paths</h1>
<p class="lede">Nobody starts at lesson one. Pick the route that matches why you are here.
Each is a subset of the same seventeen lessons, ordered for that reason rather than by
topic.</p>
${blocks}
<p>None of these routes covers everything, and that is deliberate. A path you finish is
worth more than a curriculum you abandon a third of the way through. If you want the whole
thing in order, the sidebar is the table of contents.</p>`;
}

function pageData(){
  const rows = TIERS.map(t =>
    '<tr><td><b>' + esc(t.name) + '</b></td><td>' + esc(t.size) + '</td><td>'
    + esc(t.where) + '</td><td>' + esc(t.teaches) + '</td></tr>').join("");
  const rules = TIERS.map(t =>
    '<h3>' + esc(t.name) + '</h3><p>' + esc(t.rule) + '</p>').join("");
  return `
<h1>Data strategy</h1>
<p class="lede">The data does not fit. That constraint was settled before a single lesson
was written, because everything else follows from it.</p>

<p>A single imaging run is gigabytes and a high-resolution section is larger. It cannot be
committed to the repository, cannot be executed in continuous integration, and cannot be
downloaded by a reader before lesson one. So the site uses three tiers, and every lesson
declares which one it is in.</p>

<div class="tablewrap"><table>
<thead><tr><th>Tier</th><th>Size</th><th>Where it lives</th><th>What it teaches</th></tr></thead>
<tbody>${rows}</tbody></table></div>

<h2>The rule that keeps each tier honest</h2>
${rules}

<h2>Rules that apply to all of it</h2>
<ul>
<li>Never commit primary data. Commit the <em>script</em> that fetches it, pinned to a
specific version or accession, and record the checksum.</li>
<li>Record provenance and licence per dataset. Vendor demo data, consortium releases and
paper supplements have different terms; write them down once, in
<code>data/SOURCES.md</code>.</li>
<li>Never use patient data in teaching material, and never data that could be
re-identified from tissue morphology.</li>
<li>Record negative results. “No public dataset of this tissue on this platform was
found” is a finding, and it stops the next person repeating the search.</li>
</ul>

<div class="call"><span class="ct">Why the simulated tier matters most</span>
<p>It is the only tier where the right answer is known, which makes it the only place a
reader can measure how far their estimate landed from the truth. It is also the tier most
often skipped, because it takes work to build and looks less impressive than real tissue.
Lessons 4 and 9 depend on it entirely.</p></div>`;
}

function pageHow(){
  return `
<h1>How a lesson is built</h1>
<p class="lede">Every lesson fills all seven slots, in this order. A missing slot is a
defect, not a style choice.</p>

<div class="call"><span class="ct">Rule zero</span>
<p>If you cannot write, in one sentence, the decision this lesson helps someone make, the
lesson does not exist yet. “Understand neighbourhood enrichment” is a topic. “You are about
to write that macrophages and tumour cells interact — decide whether that survives a
different radius” is a decision. It has a person in it, and a problem.</p></div>

<h2>The seven slots</h2>
<ol>
<li><b>The decision it serves.</b> One sentence, concrete, with a person in it.</li>
<li><b>Concept.</b> What is measured, in what units, at what resolution. One figure that
carries an idea rather than decorating the page. Name the assumption that breaks first.</li>
<li><b>Runnable notebook.</b> Real code, executed, on data whose truth is known — with
asserts on recovered values, identities that must hold, and units that must cancel.</li>
<li><b>Rosetta panel.</b> The same computation in R. Readers arrive from different tools.
Where no equivalent exists, the lesson says so plainly instead of omitting the slot.</li>
<li><b>Failure mode.</b> Something broken on purpose, plus the diagnostic that catches it.
This is the slot most often skipped and the one readers remember.</li>
<li><b>Self-check.</b> Three questions with folded answers, testing judgement rather than
recall.</li>
<li><b>Going further.</b> Where to read next, and what the lesson deliberately omitted.</li>
</ol>

<h2>Two rules about the code</h2>
<p>An assert that cannot fail is not a test. <code>all(x &gt; 0 for x in [])</code> is
vacuously true. Before a notebook is committed, sabotage the code each assert guards and
confirm the assert fires.</p>
<p>Executed output is committed to the repository. Frozen output that exists only on the
author's machine looks fine locally and breaks every other build, so continuous
integration publishes from the cache and never re-runs the heavy analysis. A separate
manual workflow rebuilds from source to prove the cache is honest.</p>

<h2>Two rules about sources</h2>
<p>Never write a citation from memory — verify each against the published record in the
session you write it, DOI included. An annotation from an abstract is not an annotation
from the paper, so say which you read.</p>
<p>Check the licence before reusing a figure. Most literature is all rights reserved, and
“free to read” is permission to read, not to copy. Link, never host; redraw figures from
the equations or the underlying data.</p>`;
}

function slot(n, title, inner, cls){
  return '<section class="slot ' + (cls||"") + '">'
    + '<div class="slothead"><span class="n">' + n + '</span><h2>' + title + '</h2></div>'
    + inner + '</section>';
}

function pageLesson(l){
  const track = TRACKS.find(t => t.id === l.track);
  const idx = LESSONS.indexOf(l);
  const prev = LESSONS[idx-1], next = LESSONS[idx+1];

  let h = '<div class="crumb">' + esc(track.name) + ' · Lesson ' + l.n + '</div>';
  h += '<h1>' + esc(l.title) + '</h1>';

  h += '<div class="metastrip">'
     + '<span class="pill ' + (l.status === "written" ? "done" : "draft") + '">'
     + (l.status === "written" ? "Written" : "Draft — structure only") + '</span>'
     + '<span class="pill">Data tier <b>' + esc(l.tier) + '</b></span>'
     + '<span class="pill">Runtime <b>' + esc(l.runtime) + '</b></span>'
     + '<span class="pill">Peak memory <b>' + esc(l.memory) + '</b></span>'
     + l.caps.map(c => '<span class="pill">' + esc(c) + '</span>').join("")
     + '</div>';

  h += slot(1, "The decision this serves",
    '<div class="decision">' + esc(l.decision) + '</div>'
    + '<div class="call scale"><span class="ct">Before you run it</span><p>Takes about '
    + esc(l.runtime) + ', peak memory ' + esc(l.memory) + '. Watch <b>' + esc(l.unsafe)
    + '</b> — that is what stops being safe on a full section.</p></div>');

  const conceptBody = l.conceptHTML
    ? l.conceptHTML + (l.fig ? '<figure>' + l.fig + '<figcaption>' + esc(l.figcap) + '</figcaption></figure>' : "")
    : '<p>' + esc(l.concept) + '</p>'
      + '<div class="call warn"><span class="ct">Not yet written</span><p>This lesson has its '
      + 'structure, its failure mode and its scale notes, but the concept section is a '
      + 'placeholder. Writing it from memory is exactly the failure this site exists to '
      + 'prevent, so it stays marked until the sources are verified.</p></div>';

  h += slot(2, "Concept", conceptBody
    + '<p><b>The assumption that breaks first.</b> ' + esc(l.breaks) + '</p>');

  let nb = '<p>' + esc(l.notebook) + '</p>'
    + '<p>Data tier: <b>' + esc(l.tier) + '</b>.</p>';
  if(l.codePython){
    nb += '<div class="call warn"><span class="ct">Not yet executed</span><p>This code has '
       + 'not been run in this build, so no output is shown and nothing is cached. Treat it '
       + 'as a sketch of the analysis, not a verified result.</p></div>'
       + '<pre><code>' + l.codePython + '</code></pre>'
       + '<h3>What it asserts</h3><pre><code>' + l.codeAssert + '</code></pre>';
  }else{
    nb += '<p><b>Will assert:</b> ' + esc(l.asserts) + '</p>';
  }
  h += slot(3, "Runnable notebook", nb);

  h += slot(4, "Rosetta panel",
    l.codeR ? '<p>' + esc(l.rosetta) + '</p><pre><code>' + l.codeR + '</code></pre>'
            : '<p>' + esc(l.rosetta) + '</p>');

  h += slot(5, "Failure mode",
    '<div class="call warn"><span class="ct">What it produces when it fails</span><p>'
    + esc(l.failure) + '</p></div>'
    + '<p><b>The diagnostic that catches it.</b> ' + esc(l.diagnostic) + '</p>', "fail");

  const qs = l.checks.map((q,i) =>
    '<details><summary>' + esc(q) + '</summary><div class="ans"><p>'
    + (l.answers ? esc(l.answers[i]) : "Answer not yet written.") + '</p></div></details>').join("");
  h += slot(6, "Self-check", qs);

  h += slot(7, "Going further",
    '<p>' + esc(l.further) + '</p>'
    + '<h3>Sources</h3>'
    + '<div class="call warn"><span class="ct">Citations not verified</span><p>'
    + esc(l.sources || "Sources for this lesson have not been drafted.")
    + ' Nothing here has been checked against the published record, so none of it should be '
    + 'cited until it has.</p></div>');

  h += '<nav class="pager">'
    + (prev ? '<a href="#/' + slugOf(prev) + '">← ' + esc(prev.title) + '</a>' : '<span></span>')
    + (next ? '<a href="#/' + slugOf(next) + '">' + esc(next.title) + ' →</a>' : '<span></span>')
    + '</nav>';
  return h;
}

/* ---------- router ---------- */
function render(){
  const r = (location.hash || "#/").slice(1) || "/";
  let html;
  if(r === "/") html = pageHome();
  else if(r === "/paths") html = pagePaths();
  else if(r === "/data") html = pageData();
  else if(r === "/resources") html = pageResources();
  else if(r === "/how") html = pageHow();
  else {
    const l = LESSONS.find(x => "/" + slugOf(x) === r);
    html = l ? pageLesson(l) : pageHome();
  }
  document.getElementById("main").innerHTML = html;
  document.querySelectorAll(".side a.nav").forEach(a =>
    a.classList.toggle("on", a.dataset.r === r));
  document.getElementById("side").classList.remove("open");
  document.getElementById("menubtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}

buildNav();
window.addEventListener("hashchange", render);
document.getElementById("menubtn").addEventListener("click", e => {
  const s = document.getElementById("side");
  const open = s.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", open ? "true" : "false");
});
render();
</script>
